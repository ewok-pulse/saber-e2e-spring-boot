              - build-plugin/**/'**/build.gradle.kts'
              - build-plugin/**/'**/*.java'
            java-module:
              - module/**/'**/pom.xml'
              - module/**/'**/build.gradle'
              - module/**/'**/build.gradle.kts'
              - module/**/'**/*.java'
            java-starter:
